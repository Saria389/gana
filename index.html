<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة تعلم اللغات</title>
    <link rel="stylesheet" href="style.css">

<body>

<main>

        <p id="langDesc">حالياً، أنت تستعرض محتوى اللغة اليابانية.</p>
    </section>

    <section>
        <h2>حالة التقدم</h2>
        <div class="level-box">
            <span>المستوى الأول: المبتدئ</span>
            <button class="lang-btn" onclick="location.href='levels.html'">استمرار</button>
        </div>
    </section>

<script src="script.js"></script>
</body>
</html>
